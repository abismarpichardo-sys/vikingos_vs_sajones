<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Guerrero - Vikingos vs Sajones</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #d2b48c;
            font-family: 'MedievalSharp', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle, #1a1612 0%, #000 100%);
            overflow: hidden;
        }

        .perfil-wrapper {
            display: flex;
            gap: 20px;
            width: 950px;
            height: 550px;
            align-items: stretch;
            z-index: 2;
        }

        .preview-container {
            flex: 1.2;
            /* Fondo claro para resaltar personajes oscuros */
            background: radial-gradient(circle, #ffffff 0%, #e0e0e0 100%); 
            border: 3px solid #c5a059;
            border-radius: 10px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        #visualizador-3d {
            width: 100%;
            height: 100%;
        }

        .label-preview {
            position: absolute;
            top: 15px;
            text-transform: uppercase;
            /* Color más oscuro para leer sobre blanco */
            color: #5d4e3a; 
            font-size: 1.2em;
            z-index: 10;
            font-weight: bold;
        }

        .perfil-container {
            flex: 0.8;
            background: #1a1612;
            padding: 40px;
            border: 3px solid #c5a059;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #c5a059;
            text-transform: uppercase;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px;
            margin-bottom: 30px;
            margin-top: 0;
        }

        .campo {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.9em;
            color: #c5a059;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #2a241e;
            border: 1px solid #5d4e3a;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        .btn-guardar {
            width: 100%;
            padding: 15px;
            background: #c5a059;
            color: #1a1612;
            border: none;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-guardar:hover {
            background: #e5c079;
            transform: scale(1.02);
        }

        #loading-text {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: #ffffff;
            background: rgba(93, 78, 58, 0.9);
            padding: 5px 15px;
            border-radius: 5px;
            z-index: 20;
        }
    </style>
</head>
<body>

<div class="perfil-wrapper">
    <div class="preview-container">
        <div class="label-preview">Aspecto del Guerrero</div>
        <div id="visualizador-3d"></div>
        <div id="loading-text">Esperando selección...</div>
    </div>

    <div class="perfil-container">
        <h1>Perfil del Guerrero</h1>
        
        <div class="campo">
            <label>NOMBRE DEL HÉROE</label>
            <input type="text" id="nombreInput" placeholder="Ej: Ragnar o Alfred...">
        </div>

        <div class="campo">
            <label>ELIGE TU BANDO</label>
            <select id="bandoSelect">
                <option value="vikingos">Vikingos</option>
                <option value="sajones">Sajones</option>
            </select>
        </div>

        <div class="campo">
            <label>ELIGE TU CLASE (RAZA)</label>
            <select id="claseSelect"></select>
        </div>

        <button class="btn-guardar" id="btnConfirmar">Confirmar y Entrar</button>
    </div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.129.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.129.0/examples/jsm/loaders/GLTFLoader.js';

    const clasesPorBando = {
        "vikingos": ["berserker", "Chamán", "Explorador_Vikingo", "Sanador_de_Odín"],
        "sajones": ["Arquero_del_Reino", "Caballero_Sajón", "Mago_Real", "Monje_Sanador"]
    };

    let scene, camera, renderer, currentModel;

    function init3D() {
        const container = document.getElementById('visualizador-3d');
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 1.2, 3);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Luces más potentes para compensar el fondo claro
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        animate();
    }

    function cargarModelo3D(bando, clase) {
        const loader = new GLTFLoader();
        const loadingText = document.getElementById("loading-text");
        
        if (currentModel) scene.remove(currentModel);
        loadingText.textContent = "Invocando guerrero...";

        const ruta = `../models/${bando}/${clase}/personaje.glb`;

        loader.load(ruta, (gltf) => {
            currentModel = gltf.scene;
            
            // Auto-centrado del modelo
            const box = new THREE.Box3().setFromObject(currentModel);
            const center = box.getCenter(new THREE.Vector3());
            currentModel.position.set(-center.x, -center.y, -center.z);
            
            scene.add(currentModel);
            loadingText.textContent = "¡Guerrero listo!";
        }, undefined, (error) => {
            console.error("No se encontró:", ruta);
            loadingText.textContent = "Error: Modelo no encontrado";
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        if (currentModel) currentModel.rotation.y += 0.01;
        renderer.render(scene, camera);
    }

    function actualizarInterfaz() {
        const bando = document.getElementById("bandoSelect").value;
        const claseSelect = document.getElementById("claseSelect");
        
        claseSelect.innerHTML = "";
        clasesPorBando[bando].forEach(clase => {
            const option = document.createElement("option");
            option.value = clase;
            option.textContent = clase.replace(/_/g, ' ');
            claseSelect.appendChild(option);
        });

        cargarModelo3D(bando, claseSelect.value);
    }

    document.getElementById("bandoSelect").addEventListener("change", actualizarInterfaz);
    document.getElementById("claseSelect").addEventListener("change", () => {
        cargarModelo3D(document.getElementById("bandoSelect").value, document.getElementById("claseSelect").value);
    });

    document.getElementById("btnConfirmar").onclick = () => {
        const nombre = document.getElementById("nombreInput").value;
        if (!nombre) { alert("¡Nombra a tu héroe!"); return; }
        
        localStorage.setItem("nombreJugador", nombre);
        localStorage.setItem("bando", document.getElementById("bandoSelect").value);
        localStorage.setItem("clase", document.getElementById("claseSelect").value);
        
        window.location.href = "/menu";
    };

    window.onload = () => {
        init3D();
        actualizarInterfaz();
    };
</script>
</body>
</html>
