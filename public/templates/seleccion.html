<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Guerrero - Vikingos vs Sajones</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: #0a0a0a;
            color: #d2b48c;
            font-family: 'MedievalSharp', cursive;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-image: radial-gradient(circle, #1a1612 0%, #000 100%);
            overflow: hidden;
        }
        .perfil-wrapper {
            display: flex; gap: 20px;
            width: 950px; height: 550px;
            align-items: stretch; z-index: 2;
        }
        .preview-container {
            flex: 1.2;
            background: radial-gradient(circle, #2a241e 0%, #050505 100%); 
            border: 3px solid #c5a059;
            border-radius: 10px;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.2);
        }
        #visualizador-3d { width: 100%; height: 100%; }
        .label-preview {
            position: absolute; top: 15px;
            text-transform: uppercase;
            color: #c5a059; 
            font-size: 1.2em; z-index: 10; font-weight: bold;
        }
        .perfil-container {
            flex: 0.8;
            background: #1a1612;
            padding: 40px;
            border: 3px solid #c5a059;
            border-radius: 10px;
            text-align: center;
            display: flex; flex-direction: column; justify-content: center;
        }
        h1 {
            color: #c5a059;
            border-bottom: 2px solid #c5a059;
            padding-bottom: 10px; margin-bottom: 30px; margin-top: 0;
        }
        .campo { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 0.9em; color: #c5a059; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 12px;
            background: #2a241e; border: 1px solid #5d4e3a;
            color: white; font-family: inherit; outline: none;
        }
        /* Estilo para cuando el bando está bloqueado */
        select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: #444;
        }
        .btn-guardar {
            width: 100%; padding: 15px;
            background: #c5a059; color: #1a1612;
            border: none; font-weight: bold; font-size: 1.1em;
            cursor: pointer; margin-top: 20px; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-guardar:hover { background: #e5c079; transform: scale(1.02); }
        #loading-text {
            position: absolute; bottom: 20px;
            font-size: 0.9em; color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px; border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="perfil-wrapper">
    <div class="preview-container">
        <div class="label-preview">Aspecto del Guerrero</div>
        <div id="visualizador-3d"></div>
        <div id="loading-text">Esperando selección...</div>
    </div>

    <div class="perfil-container">
        <h1>Nuevo Guerrero</h1>
        
        <div class="campo">
            <label>NOMBRE DEL HÉROE</label>
            <input type="text" id="nombreInput" placeholder="Nombra a tu leyenda...">
        </div>

        <div class="campo">
            <label>BANDO (LEALTAD)</label>
            <select id="bandoSelect">
                <option value="vikingos">Vikingos</option>
                <option value="sajones">Sajones</option>
            </select>
            <small id="msg-bloqueo" style="color: #888; font-size: 0.7em; display: none; margin-top: 5px;">
                * Tu cuenta ya está juramentada a este bando.
            </small>
        </div>

        <div class="campo">
            <label>CLASE DE GUERRERO</label>
            <select id="claseSelect"></select>
        </div>

        <button class="btn-guardar" id="btnConfirmar">Forjar Destino</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

<script src="/js/selector.js"></script>

<script>
    // Lógica adicional para el bloqueo de bando según la cuenta
    document.addEventListener('DOMContentLoaded', () => {
        const bandoBloqueado = localStorage.getItem("bandoBloqueado");
        const bandoSelect = document.getElementById("bandoSelect");
        const msgBloqueo = document.getElementById("msg-bloqueo");

        if (bandoBloqueado && bandoSelect) {
            bandoSelect.value = bandoBloqueado;
            bandoSelect.disabled = true; // No dejamos cambiar el bando
            msgBloqueo.style.display = "block";
            
            // Forzamos la actualización de la interfaz para que cargue las razas correctas
            if (window.actualizarInterfaz) window.actualizarInterfaz();
        }
    });
</script>

</body>
</html>
