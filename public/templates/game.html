<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikingos vs Sajones - En Batalla</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000; 
        }
        #ui {
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white;
            background: rgba(0, 0, 0, 0.75); 
            padding: 15px; 
            border-radius: 12px;
            pointer-events: none; 
            z-index: 100;
            border: 2px solid #d4af37; /* Color Oro */
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #loading {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #000; 
            color: #d4af37; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            transition: opacity 1s ease;
        }
        #progress { 
            font-size: 1.2em; 
            margin-top: 10px; 
            font-weight: bold; 
            text-shadow: 0 0 10px gold;
        }
        canvas { display: block; }
        
        /* Pequeño destello para los mensajes de los portales */
        .portal-msg {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
    </style>
</head>
<body>

    <div id="loading">
        <h1 id="loading-msg">CARGANDO REINO...</h1>
        <div id="progress">Preparando hachas y escudos...</div>
    </div>

    <div id="ui">
        <strong style="color: #d4af37;">⚔ Vikingos vs Sajones</strong><br>
        <span id="bandoTexto">Cargando facción...</span><br>
        <hr style="border: 0.5px solid #555; margin: 8px 0;">
        <small>Mover: <strong>W A S D</strong></small><br>
        <small>Vista: <strong>Ratón / Zoom</strong></small><br>
        <small>Acción: <strong>ESPACIO / CLIC</strong></small><br>
        <small>Barco: <strong>E (Subir/Bajar)</strong></small><br>
        <small>Portales: <strong>Acércate para viajar</strong></small><br>
        <small>Salir: <strong>ESC</strong></small>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="/js/mapas.js"></script>
    <script src="/js/visuales.js"></script>
    <script src="/js/game.js?v=2.3"></script>
    <script src="/js/game_manager.js?v=2.3"></script>

    <script>
        // Función para ocultar la pantalla de carga
        function ocultarCarga() {
            const pantalla = document.getElementById("loading");
            if (pantalla) {
                pantalla.style.opacity = "0";
                setTimeout(() => {
                    pantalla.style.display = "none";
                }, 1000);
            }
        }

        // Personalización de la UI según el bando elegido
        window.addEventListener('load', () => {
            const bando = localStorage.getItem("bando") || "vikingos";
            const clase = localStorage.getItem("clase") || "Berserker";
            const bandoUI = document.getElementById("bandoTexto");
            const loadMsg = document.getElementById("loading-msg");

            if (bando === "vikingos") {
                bandoUI.innerHTML = `<span style="color:#ff4444">VIKINGO:</span> ${clase}`;
                loadMsg.innerText = "VIAJANDO AL VALHALLA...";
            } else {
                bandoUI.innerHTML = `<span style="color:#44aaff">SAJÓN:</span> ${clase}`;
                loadMsg.innerText = "DEFENDIENDO EL REINO...";
            }
        });
    </script>

</body>
</html>
