<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikingos vs Sajones - Saga Rúnica</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        /* --- 🖼️ MARCO POR IMAGEN (Ajustado para estirar laterales) --- */
        #marco-final {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 500; 
            
            /* Usamos tu imagen */
            background-image: url('/images/tu_marco.png'); 
            
            /* --- AJUSTE DE ESTIRADO LATERAL --- */
            /* El 110% estira la imagen a los lados para que el borde se vea más fino */
            background-size: 105% 100%; 
            
            background-repeat: no-repeat;
            background-position: center;
            box-sizing: border-box;
        }

        /* --- ⏳ RELOJ FLOTANTE (Encima del marco pero sin taparlo todo) --- */
        #barra-tiempo {
            position: fixed;
            top: 15px; 
            left: 50%;
            transform: translateX(-50%); 
            width: auto; 
            min-width: 200px;
            height: auto;
            padding: 5px 20px;
            background: rgba(40, 30, 20, 0.9);
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4af37;
            font-family: 'Georgia', serif;
            letter-spacing: 2px;
            font-size: 0.9em;
            z-index: 600; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        /* --- UI ORIGINAL (CONTROLES) --- */
        #ui {
            position: absolute; 
            top: 90px; 
            left: 80px; 
            color: white;
            background: rgba(0, 0, 0, 0.85); 
            padding: 15px; 
            border-radius: 10px;
            pointer-events: none; 
            z-index: 100;
            border: 1px solid #d4af37;
        }

        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #d4af37; display: flex; 
            flex-direction: column; justify-content: center; align-items: center; 
            z-index: 1000; transition: opacity 1s ease;
        }
        #progress { font-size: 1.2em; margin-top: 10px; font-weight: bold; }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="loading">
        <h1 id="loading-msg">CARGANDO REINO...</h1>
        <div id="progress">Preparando hachas y escudos...</div>
    </div>

    <div id="barra-tiempo">
        <span id="fecha-real"></span>&nbsp;&nbsp;|&nbsp;&nbsp;<strong id="hora-real">00:00:00</strong>
    </div>

    <div id="marco-final"></div>

    <div id="ui">
        <strong style="color: #d4af37;">⚔ Vikingos vs Sajones</strong><br>
        <span id="bandoTexto">Cargando facción...</span><br>
        <hr style="border: 0.5px solid #555; margin: 8px 0;">
        <small>Mover: <strong>W A S D</strong></small><br>
        <small>Vista: <strong>Ratón / Zoom</strong></small><br>
        <small>Acción: <strong>ESPACIO / CLIC</strong></small><br>
        <small>Barco: <strong>E (Subir/Bajar)</strong></small><br>
        <small>Salir: <strong>ESC</strong></small>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="/js/mapas.js"></script>
    <script src="/js/visuales.js"></script>
    <script src="/js/game.js?v=2.3"></script>
    <script src="/js/game_manager.js?v=2.3"></script>

    <script>
        function actualizarReloj() {
            const ahora = new Date();
            const h = String(ahora.getHours()).padStart(2, '0');
            const m = String(ahora.getMinutes()).padStart(2, '0');
            const s = String(ahora.getSeconds()).padStart(2, '0');
            document.getElementById('hora-real').innerText = `${h}:${m}:${s}`;
            const opciones = { day: 'numeric', month: 'short' };
            document.getElementById('fecha-real').innerText = ahora.toLocaleDateString('es-ES', opciones).toUpperCase();
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        function ocultarCarga() {
            const pantalla = document.getElementById("loading");
            if (pantalla) {
                pantalla.style.opacity = "0";
                setTimeout(() => { pantalla.style.display = "none"; }, 1000);
            }
        }

        window.addEventListener('load', () => {
            const bando = localStorage.getItem("bando") || "vikingos";
            const clase = localStorage.getItem("clase") || "Berserker";
            const bandoUI = document.getElementById("bandoTexto");
            if (bando === "vikingos") {
                bandoUI.innerHTML = `<span style="color:#ff4444">VIKINGO:</span> ${clase}`;
            } else {
                bandoUI.innerHTML = `<span style="color:#44aaff">SAJÓN:</span> ${clase}`;
            }
        });
    </script>
</body>
</html>
