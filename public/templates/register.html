<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Vikingos vs Sajones</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* FONDO DE PANTALLA COMPLETA UNIFICADO */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'MedievalSharp', cursive, serif;
            color: #e0e0e0;
            overflow: hidden;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                url('https://images.unsplash.com/photo-1444492417251-9c84a5fa1c8b?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-screen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .login-panel {
            background: rgba(26, 22, 18, 0.95);
            padding: 50px 40px;
            border: 2px solid #c5a059;
            outline: 6px solid rgba(197, 160, 89, 0.1);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 
                        inset 0 0 30px rgba(197, 160, 89, 0.05);
            width: 380px;
            text-align: center;
            z-index: 2;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        h2 {
            font-weight: 300;
            font-size: 0.9em;
            color: #d2b48c;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input {
            background: #0f0d0b;
            border: 1px solid #5d4e3a;
            padding: 15px;
            color: #f0e68c;
            outline: none;
            transition: all 0.3s;
            font-family: inherit;
            font-size: 1em;
        }

        input:focus {
            border-color: #d4af37;
            background: #1a1612;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-play {
            background: linear-gradient(145deg, #c5a059 0%, #8e6d31 100%);
            color: #1a1612;
            border: none;
            padding: 18px;
            font-weight: bold;
            font-size: 1.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 15px;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }

        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(197, 160, 89, 0.6);
            filter: brightness(1.2);
        }

        .registro {
            margin-top: 25px;
            font-size: 0.9em;
            color: #7a6b5a;
        }

        .registro a {
            color: #c5a059;
            text-decoration: none;
            font-weight: bold;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

<div class="vignette"></div>

<div class="login-screen">
    <div class="login-panel">
        <h1>Vikingos vs Sajones</h1>
        <h2>Crear Cuenta</h2>

        <form action="/registro" method="POST">
            <input type="text" name="username" placeholder="Nombre de Guerrero" required>
            <input type="password" name="password" placeholder="Clave Secreta" required>
            <button class="btn-play" type="submit">Jurar Lealtad</button>
        </form>

        <p class="registro">
            ¿Ya eres un veterano? 
            <a href="login.html">Regresar al Inicio</a>
        </p>
    </div>
</div>

</body>
</html>
